server.port=8080
spring.application.name=stark-vms

# ---------- Default: H2 database stored in ./data (survives restarts) ----------
spring.datasource.url=jdbc:h2:file:./data/vmsdb;AUTO_SERVER=TRUE
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# ---------- Alternative: MySQL (comment out the H2 block above, uncomment this) ----------
# spring.datasource.url=jdbc:mysql://localhost:3306/stark_vms?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC
# spring.datasource.username=root
# spring.datasource.password=YOUR_MYSQL_PASSWORD
# spring.datasource.driverClassName=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
